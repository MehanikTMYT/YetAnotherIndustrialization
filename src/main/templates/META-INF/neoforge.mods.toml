modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Luligabi1/YetAnotherIndustrialization/issues/"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Luligabi1/YetAnotherIndustrialization/"
logoFile="assets/${mod_id}/logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="${mod_id}-accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="modern_industrialization"
    type="required"
    versionRange="${modern_industrialization_version_range}"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="tesseract_api"
    type="required"
    versionRange="${tesseract_version_range}"
    ordering="AFTER"
    side="BOTH"
    # синк/порт 26.1.2: tesseract-api-neoforge 1.13.7-26.1.2-fleet.1 совместим с MI 2.6.0-fleet01
    # (эталон: Industrialization-Overdrive mods.toml — type="required", smoke errors=0).
    # Обязателен: YAIHookRegistry/YAIHookListener (@MIHookEntrypoint) регистрируют машины YAI
    # через tesseract MI-hook; без tesseract_api в рантайме мод не загрузится.
