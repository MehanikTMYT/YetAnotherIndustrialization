plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    setAccessTransformers {
        file("src/main/resources/${project.mod_id}-accesstransformer.cfg")
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO

            systemProperty 'guideme.yet_another_industrialization.guide.sources',
                    file("src/main/resources/assets/yet_another_industrialization/yai_guidebook/").absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // синк/порт 26.1.2: GrandPower 3.0.2 из modmaven — для MC 1.21.x (NoClassDefFoundError ResourceLocation на 26).
    // Подключаем портированный jar из дерева (видение другого агента, smoke grandpower STARTED).
    implementation files("libs/grandpower-3.0.2-port26.1.2.jar")
    implementation "aztech:Modern-Industrialization:${modern_industrialization_version}"
    // синк/порт 26.1.2: tesseract-api-neoforge 1.13.7-26.1.2-fleet.1 совместим с MI 2.6.0-fleet01
    // (эталон: EI build.gradle `implementation`, Industrialization-Overdrive — то же, smoke errors=0).
    // Нужен в рантайме: @MIHookEntrypoint-реестры YAIHookRegistry/YAIHookListener регистрируют
    // машины/кейсины через tesseract MI-hook (вариант А, по образцу IOMIHookRegistry/IOMIHookListener).
    implementation "net.swedz:tesseract-api-neoforge:${tesseract_version}"
    // fleet: аннотации net.swedz.tesseract.config.annotation (ConfigComment/ConfigKey/Range/SubSection)
    // лежат в tesseract-api:1.0.2, а НЕ в tesseract-api-neoforge — как в EI и Overdrive.
    compileOnly "net.swedz:tesseract-api:1.0.2"
    implementation "org.appliedenergistics:guideme:${guideme_version}"

    compileOnly "dev.emi:emi-neoforge:${emi_version}+${emi_minecraft_version}:api"
    localRuntime "dev.emi:emi-neoforge:${emi_version}+${emi_minecraft_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            modern_industrialization_version_range: modern_industrialization_version_range,
            tesseract_version_range: tesseract_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
