// Compile the converted foundation independently while the rest of the port is incomplete.
// This is deliberately separate from build: it must never produce a runnable mod JAR.
allprojects {
    afterEvaluate {
        sourceSets {
            foundation {
                java.srcDirs = ['src/main/java']
                java.include 'me/luligabi/yet_another_industrialization/common/YAIIds.java'
                java.include 'me/luligabi/yet_another_industrialization/common/YAIConfig.java'
                java.include 'me/luligabi/yet_another_industrialization/client/YAIClientConfig.java'
                java.include 'me/luligabi/yet_another_industrialization/common/util/EmptyEnergyAccess.java'
                java.include 'me/luligabi/yet_another_industrialization/common/util/EnergyComponentStorage.java'
                java.include 'me/luligabi/yet_another_industrialization/common/util/YAIDraggable.java'
                java.include 'me/luligabi/yet_another_industrialization/common/util/YAIText.java'
                java.include 'me/luligabi/yet_another_industrialization/common/misc/YAITags.java'
                java.include 'me/luligabi/yet_another_industrialization/common/misc/YAISounds.java'
                java.include 'me/luligabi/yet_another_industrialization/common/misc/YAIDamageTypes.java'
                java.include 'me/luligabi/yet_another_industrialization/common/misc/effect/*.java'
                java.include 'me/luligabi/yet_another_industrialization/common/misc/component/*.java'
                java.include 'me/luligabi/yet_another_industrialization/common/item/food/*.java'
                java.include 'me/luligabi/yet_another_industrialization/common/item/misc/*.java'
                java.include 'me/luligabi/yet_another_industrialization/common/compat/guideme/*.java'
                java.include 'me/luligabi/yet_another_industrialization/common/item/tools/*.java'
                java.include 'me/luligabi/yet_another_industrialization/common/item/YAIItems.java'
                java.include 'me/luligabi/yet_another_industrialization/common/misc/network/*.java'
                java.include 'me/luligabi/yet_another_industrialization/client/SlotLockerClient.java'
                java.include 'me/luligabi/yet_another_industrialization/client/renderer/item/*.java'
                java.include 'me/luligabi/yet_another_industrialization/common/compat/recipeviewer/emi/*.java'
                compileClasspath += sourceSets.main.compileClasspath
            }
            foundationTest {
                java.srcDirs = ['src/foundationTest/java']
                compileClasspath += sourceSets.foundation.output + sourceSets.main.compileClasspath
                runtimeClasspath += output + compileClasspath
            }
        }
        tasks.register('foundationQaJar', Jar) {
            dependsOn tasks.named('foundationTestClasses')
            archiveClassifier = 'foundation-qa'
            from('src/main/resources') { include 'assets/**' }
            from('src/generated/resources') { include 'assets/**' }
            from sourceSets.foundation.output
            from sourceSets.foundationTest.output
        }
    }
}
